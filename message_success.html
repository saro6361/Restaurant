<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Message Sent | WE CRUNCH</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"/>
  <style>
    body {
      background: #fdf8f4;
      font-family: 'Poppins', sans-serif;
      text-align: center;
      padding: 50px 20px;
    }
    .success-container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    .success-container img {
      max-width: 180px;
      margin-bottom: 20px;
    }
    .success-container h2 {
      color: #28a745;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .success-container p {
      font-size: 18px;
      color: #555;
    }
    .btn-home {
      margin-top: 30px;
      padding: 10px 30px;
      background-color: #dc3545;
      border: none;
      color: white;
      border-radius: 5px;
      transition: background 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-home:hover {
      background-color: #c82333;
    }
  </style>
</head>
<body>

  <div class="success-container" data-aos="zoom-in">
    <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" alt="Success Icon">
    <h2>Message Sent Successfully!</h2>
    <p>Thank you for reaching out. We'll get back to you as soon as possible.</p>
    <a href="index.html" class="btn-home">Go Back to Home</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script>AOS.init();</script>
</body>
</html>
