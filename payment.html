<!DOCTYPE html>
<html>
<head>
  <title>Razorpay Payment</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>
  <h2>Buy Now</h2>
  <button id="rzp-button1">Pay Now</button>

  <script>
    // Get query parameters (item & price)
    const urlParams = new URLSearchParams(window.location.search);
    const item = urlParams.get('item') || 'Food Order';
    const price = urlParams.get('price') || '100';

    // Razorpay amount (convert ₹ to paise)
    const amountInPaise = parseInt(price) * 100;

    var options = {
      "key": "rzp_test_T3sTKeYxX123", // ✅ Replace with your key
      "amount": amountInPaise,
      "currency": "INR",
      "name": "WE CRUNCH Restaurant",
      "description": item,
      "handler": function (response){
        // Redirect with all details
        window.location.href = `payment_success.php?payment_id=${response.razorpay_payment_id}&item=${item}&price=${price}`;
      },
      "theme": {
        "color": "#3399cc"
      }
    };

    var rzp1 = new Razorpay(options);
    document.getElementById('rzp-button1').onclick = function(e){
      rzp1.open();
      e.preventDefault();
    }
  </script>
</body>
</html>
